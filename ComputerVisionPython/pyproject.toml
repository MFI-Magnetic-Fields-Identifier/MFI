[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mfi-cv"
version = "0.1.0"
description = "Módulo de visão computacional do MFI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["SQLAlchemy==2.1.9", "alembic==1.20.1", "Pillow==13.0.0"]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
postgres = ["psycopg[binary]==3.3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
